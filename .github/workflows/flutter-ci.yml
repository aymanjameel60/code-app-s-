name: Flutter CI
# Build trigger: Android artifacts requested.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Ensure native platform scaffolding
        run: |
          flutter create . --platforms=android,ios --org com.spike --project-name spike_flutter_app
          rm -rf android/app/src/main/kotlin/com/spike/spike_flutter_app
          grep -RIl 'com.spike.spike_flutter_app' android ios | xargs -r sed -i 's/com\.spike\.spike_flutter_app/com.spike.customer/g'
          rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test test/smoke_test.dart
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release AAB
        run: flutter build appbundle --release
      - name: Upload Android builds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spike-android-builds
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  build-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure iOS scaffolding
        run: |
          flutter create . --platforms=ios --org com.spike --project-name spike_flutter_app
          grep -RIl 'com.spike.spike_flutter_app' ios | xargs -r sed -i '' 's/com\.spike\.spike_flutter_app/com.spike.customer/g'
          rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS simulator
        run: flutter build ios --simulator --no-codesign
