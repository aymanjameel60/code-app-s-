name: spike_flutter_app
description: Native Flutter customer app for Spike marketplace.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.4.1
  go_router: ^14.2.7
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Graphik Arabic is intentionally not bundled in this repository yet.
# Add the licensed files under assets/fonts/ before release.
