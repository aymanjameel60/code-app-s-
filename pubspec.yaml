name: spike_flutter_app
description: Native Flutter customer app for Spike marketplace.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.4.1
  go_router: ^14.2.7
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  lucide_icons:
    path: packages/lucide_icons_compat
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: GraphikArabic
      fonts:
        - asset: assets/fonts/GraphikArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/GraphikArabic-Extralight.ttf
          weight: 200
        - asset: assets/fonts/GraphikArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/GraphikArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/GraphikArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/GraphikArabic-Semibold.ttf
          weight: 600
        - asset: assets/fonts/GraphikArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/GraphikArabic-Black.ttf
          weight: 900
